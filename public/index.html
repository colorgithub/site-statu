<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0b0d" />
<title>站点状态</title>
<meta name="description" content="实时监控各站点可用性与响应速度" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2322c55e' stroke-width='4'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="wrap topbar__inner">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <div class="brand__text">
        <h1 id="siteTitle">站点状态</h1>
        <p id="siteSubtitle">实时监控各站点可用性与响应速度</p>
      </div>
    </div>

    <div class="topbar__actions">
      <span class="stamp" id="updated">等待首次检测…</span>
      <button class="btn" id="refreshBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.3 5.7" /><path d="M20 5v6h-6" />
        </svg>
        刷新
      </button>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="切换主题" title="切换明暗主题">
        <svg class="ico ico--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2.5v2M12 19.5v2M4.5 4.5l1.4 1.4M18.1 18.1l1.4 1.4M2.5 12h2M19.5 12h2M4.5 19.5l1.4-1.4M18.1 5.9l1.4-1.4" />
        </svg>
        <svg class="ico ico--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z" />
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap main">

  <!-- 总体状态 -->
  <section class="banner" id="banner" aria-live="polite">
    <span class="banner__dot" id="bannerDot"></span>
    <div class="banner__text">
      <strong id="bannerTitle">正在检测…</strong>
      <span id="bannerDesc">首次检测可能需要几秒钟</span>
    </div>
    <dl class="banner__metrics" id="bannerMetrics"></dl>
  </section>

  <!-- 站点列表 -->
  <section class="panel">
    <div class="panel__head">
      <span>站点</span>
      <span>最近 40 次检测</span>
      <span class="ta-r">可用率</span>
      <span class="ta-r">响应</span>
      <span class="ta-r">状态</span>
    </div>
    <div id="groups"></div>
    <div class="empty" id="empty" hidden>配置里还没有站点，编辑 <code>sites.config.js</code> 添加即可。</div>
  </section>

  <!-- 图例与说明 -->
  <section class="legend">
    <div class="legend__items">
      <span class="legend__item"><i class="dot dot--ok"></i>正常</span>
      <span class="legend__item"><i class="dot dot--slow"></i>缓慢</span>
      <span class="legend__item"><i class="dot dot--down"></i>故障</span>
      <span class="legend__item"><i class="dot dot--pending"></i>检测中</span>
    </div>
    <p class="legend__note" id="legendNote"></p>
  </section>

</main>

<footer class="footer">
  <div class="wrap footer__inner">
    <span id="footerInfo">站点状态监控</span>
    <span>数据保存在本地 · <code>data/history.json</code></span>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>

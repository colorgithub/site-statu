<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0b0d" />
<title>站点状态</title>
<meta name="description" content="实时监控各站点可用性与响应速度" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2322c55e' stroke-width='4'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="wrap topbar__inner">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <h1 id="siteTitle">站点状态</h1>
    </div>

    <div class="topbar__actions">
      <span class="stamp" id="updated">等待首次检测…</span>
      <button class="btn" id="refreshBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.3 5.7" /><path d="M20 5v6h-6" />
        </svg>
        刷新
      </button>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="切换主题" title="切换明暗主题">
        <svg class="ico ico--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2.5v2M12 19.5v2M4.5 4.5l1.4 1.4M18.1 18.1l1.4 1.4M2.5 12h2M19.5 12h2M4.5 19.5l1.4-1.4M18.1 5.9l1.4-1.4" />
        </svg>
        <svg class="ico ico--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z" />
        </svg>
      </button>
      <div class="topbar__admin" id="adminArea"></div>
    </div>
  </div>
</header>

<main class="wrap main">

  <!-- 公告横幅（由管理员在编辑面板里维护） -->
  <div class="notice" id="notice" hidden role="status">
    <span class="notice__dot" aria-hidden="true"></span>
    <p class="notice__text" id="noticeText"></p>
  </div>

  <!-- 总体状态 -->
  <section class="banner" id="banner" aria-live="polite">
    <span class="banner__dot" id="bannerDot"></span>
    <strong class="banner__title" id="bannerTitle">正在检测…</strong>
    <dl class="banner__metrics" id="bannerMetrics"></dl>
  </section>

  <!-- 站点列表 -->
  <section class="panel">
    <div class="panel__head">
      <span>站点</span>
      <span>最近 40 次检测</span>
      <span class="ta-r">可用率</span>
      <span class="ta-r">响应</span>
      <span class="ta-r">状态</span>
    </div>
    <div id="groups"></div>
    <div class="empty" id="empty" hidden>还没有站点，管理员登录后可在「编辑」里添加。</div>
  </section>

</main>

<!-- 编辑面板（仅管理员可见） -->
<div class="modal" id="editor" hidden>
  <div class="modal__mask" data-close="1"></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
    <header class="modal__head">
      <h2 id="editorTitle">编辑面板</h2>
      <button class="icon-btn" type="button" data-close="1" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </header>

    <div class="modal__body">
      <section class="field-group">
        <h3 class="field-group__title">公告横幅</h3>

        <label class="switch-row">
          <input type="checkbox" id="bannerEnabled" />
          <span>在页面顶部显示公告条</span>
        </label>

        <label class="field">
          <span class="field__label">文案</span>
          <textarea id="bannerText" class="input" rows="2" maxlength="200"
                    placeholder="例如：今晚 23:00 起进行例行维护，预计 30 分钟"></textarea>
        </label>

        <label class="field">
          <span class="field__label">级别</span>
          <select id="bannerLevel" class="input">
            <option value="info">提示</option>
            <option value="warning">注意</option>
            <option value="critical">严重</option>
          </select>
        </label>
      </section>

      <section class="field-group">
        <h3 class="field-group__title">监控站点</h3>
        <div class="site-editor" id="siteEditor"></div>
        <button class="btn" type="button" id="addSiteBtn">添加站点</button>
        <p class="field-hint">删除站点会同时清掉它的历史记录；改名不影响历史。</p>
      </section>
    </div>

    <footer class="modal__foot">
      <button class="btn" type="button" data-close="1">取消</button>
      <button class="btn btn--primary" type="button" id="saveBtn">保存</button>
    </footer>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
